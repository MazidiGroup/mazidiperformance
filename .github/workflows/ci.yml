name: CI

# Builds and tests both targets on a hosted macOS runner.
#
# Runner / toolchain pinning (IMPORTANT):
#   Local developer validation for slice 1 used Xcode 26.6 with the iOS 26.5 simulator
#   runtime. GitHub-hosted runners do NOT provide that combination. This workflow pins a
#   supported hosted combination — macOS 15 + Xcode 16.4 (Swift 6.x) — and discovers an
#   available iPhone simulator at run time. Because the toolchain and simulator runtime
#   differ from local, CI is the authority for THIS pinned combination: a green local run
#   does not guarantee a green CI run, and vice versa. Treat the first CI run on a PR as
#   required confirmation.
#
# No code signing and no secrets are required: everything targets the iOS Simulator, and
# signing is explicitly disabled for the app build.

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: MazidiKit + app (Debug tests, Release build)
    runs-on: macos-15
    env:
      XCODE_VERSION: "16.4"
      PROJECT: MazidiPerformance.xcodeproj
      # MazidiKit has no external SwiftPM dependencies, so there is nothing safe or useful
      # to cache; dependency caching is intentionally omitted for reproducibility.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Toolchain versions
        run: |
          set -euxo pipefail
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: |
          set -euxo pipefail
          brew install xcodegen
          xcodegen --version

      # 1) Package tests — platform-neutral core, no simulator needed.
      - name: swift test (MazidiKit)
        working-directory: Packages/MazidiKit
        run: |
          set -euxo pipefail
          swift test

      # 2) Generate the Xcode project from the canonical project.yml.
      - name: Generate Xcode project
        run: |
          set -euxo pipefail
          xcodegen generate

      # 3) Discover the actual application scheme (do not hardcode). The generated project
      #    exposes package library schemes too, so select the shared scheme whose buildable
      #    is an application (.app product) rather than assuming a position or a name.
      - name: Discover scheme
        id: scheme
        run: |
          set -euo pipefail
          SCHEME=""
          for f in "$PROJECT"/xcshareddata/xcschemes/*.xcscheme; do
            if grep -q 'BuildableName = "[^"]*\.app"' "$f"; then
              SCHEME=$(basename "$f" .xcscheme); break
            fi
          done
          if [ -z "$SCHEME" ]; then
            echo "No application scheme (.app buildable) found"; ls "$PROJECT"/xcshareddata/xcschemes/ || true; exit 1
          fi
          echo "Using application scheme: $SCHEME"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"

      # 4) Discover an available iPhone simulator (do not hardcode a device).
      - name: Discover simulator
        id: sim
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available --json | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; u=[dev['udid'] for rt in d for dev in d[rt] if dev.get('isAvailable') and 'iPhone' in dev['name']]; print(u[0] if u else '')")
          if [ -z "$UDID" ]; then
            echo "No available iPhone simulator found"; xcrun simctl list devices available; exit 1
          fi
          NAME=$(xcrun simctl list devices --json | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(dev['name'] for rt in d for dev in d[rt] if dev.get('udid')=='$UDID'))")
          echo "Using simulator: $NAME ($UDID)"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      # 5) Debug build + full app/UI test suite on the discovered simulator.
      - name: Debug build & test (iOS Simulator)
        run: |
          set -euxo pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "${{ steps.scheme.outputs.scheme }}" \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath "build/DebugTests.xcresult" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            test

      # 6) Release build for the simulator (no signing).
      - name: Release build (iOS Simulator)
        run: |
          set -euxo pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "${{ steps.scheme.outputs.scheme }}" \
            -configuration Release \
            -destination "generic/platform=iOS Simulator" \
            -resultBundlePath "build/ReleaseBuild.xcresult" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build

      # 7) On failure, upload result bundles so the failure is diagnosable off-runner.
      - name: Upload result bundles
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcresults
          path: build/*.xcresult
          if-no-files-found: ignore
          retention-days: 14
