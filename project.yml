# XcodeGen manifest — run `xcodegen generate` on macOS (see docs/BUILD_AND_TEST.md).
# The .xcodeproj is generated, never committed.
name: MazidiPerformance
options:
  bundleIdPrefix: com.mazidigroup
  deploymentTarget:
    iOS: "17.0"   # DL-10: minimum version pending product confirmation
  developmentLanguage: en
packages:
  MazidiKit:
    path: Packages/MazidiKit
# Environment configurations (ARCHITECTURE.md §7). Staging maps to a release-style
# build; server URLs/flags come from the per-config .xcconfig files (Config/*.xcconfig),
# never hard-coded. Adding Staging does not change Debug/Release behaviour.
configs:
  Debug: debug
  Staging: release
  Release: release
settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
    # Apple Developer team for automatic signing. This is an account identifier, not a
    # secret — it appears in every built binary. No certificates, profiles or keys are
    # committed; Xcode fetches those per-developer.
    DEVELOPMENT_TEAM: JWAX6S948T
    # Version (CFBundleShortVersionString) and build (CFBundleVersion).
    # Owner set "1.0.01"; recorded here as 1.0.1 because a leading zero is not a
    # canonical period-separated integer and risks App Store Connect validation.
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  MazidiPerformance:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/Debug.xcconfig
      Staging: Config/Staging.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        # App icon lives in App/Resources/Assets.xcassets (single 1024×1024 source;
        # Xcode derives every other size). Required for App Store submission.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        # LOCAL_IDENTITY gates the device-local test profile (ADR-0014) — the only way to
        # open the app while no authentication backend exists (R-01). It is set for Debug
        # and Staging ONLY. Staging is the TestFlight configuration and is a *release*
        # build, so `#if DEBUG` would not survive there; that is why this is its own
        # condition rather than a reuse of DEBUG.
        #
        # Release deliberately has NO entry here: it keeps `UnavailableAuthProvider`, so an
        # accidental App Store submission still cannot sign in. Do not add LOCAL_IDENTITY to
        # Release — `Scripts/check-release-isolation.sh` fails the build if the symbols ever
        # appear in a Release binary.
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG LOCAL_IDENTITY"
        Staging:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "LOCAL_IDENTITY"
    sources:
      - App
      # Canonical exercise catalogue + delivery manifest (ADR-0010), bundled read-only
      # so the app-facing catalogue read model (ADR-0011 §1) can load them at runtime.
      # Referenced in place from the generated source-of-truth — not copied into App/.
      - path: content/exercises/catalogue/catalogue.json
        buildPhase: resources
      - path: content/exercises/catalogue/media-manifest.json
        buildPhase: resources
      # Full client-content draft (all catalogued slugs): display names + approved
      # aliases for catalogue search, and draft coaching copy for the coach preview.
      # DRAFT status — always labelled "DRAFT COPY · PENDING REVIEW" where shown.
      - path: content/exercises/client-layer/mazidi-client-content-draft.json
        buildPhase: resources
    dependencies:
      - package: MazidiKit
        products: [MazidiFoundations, MazidiDomain, MazidiPersistence, MazidiPersistenceGRDB, MazidiSync, MazidiServices, MazidiNetworking, MazidiAuth, MazidiContent]
    info:
      path: App/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: Mazidi Performance
        # Bound to the build settings above so the version is declared in one place.
        # Without these, XcodeGen writes its own defaults (1.0 / 1) and silently
        # ignores MARKETING_VERSION / CURRENT_PROJECT_VERSION.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Exercise-media origin (ADR-0010 §6 / ADR-0011 §6), sourced from the active
        # configuration's .xcconfig (MEDIA_BASE_URL). Empty until a CDN exists (R-02);
        # empty means the remote media tier is disabled. No secret is stored here.
        MediaBaseURL: $(MEDIA_BASE_URL)
        # Backend sync origin (ADR-0012 §1), from the active configuration's .xcconfig
        # (SYNC_BASE_URL). Empty until a backend exists (R-01/R-02); empty means the sync
        # transport is inert (only the DEBUG fake runs). No secret is stored here.
        SyncBaseURL: $(SYNC_BASE_URL)
        # Health/photo/calendar usage strings are added when those features land
        # (phases 5/7) — permissions are off by default and never a prerequisite (8g).
  MazidiPerformanceUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: MazidiPerformance
schemes:
  MazidiPerformance:
    build:
      targets: { MazidiPerformance: all }
    test:
      targets: [MazidiPerformanceUITests]
    # Archive with Staging, not Release. TestFlight builds must carry the
    # LOCAL_IDENTITY condition (Debug + Staging only, ADR-0014); a Release archive
    # has no local profile, so every tester would hit the sign-in wall with no way
    # past it. Release stays available by switching this in Edit Scheme → Archive,
    # which is a deliberate act — appropriate, since App Store submission is out of
    # scope until the backend lands.
    archive:
      config: Staging
